server:
  port: 8080

spring:
  profiles:
    # 本地默认 local；线上由容器环境变量 SPRING_PROFILES_ACTIVE=prod 指定（compose 已配）
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wx:
  # app-id 非敏感可入库，AppSecret 真值只放 gitignored 的 application-local.yml /
  # application-prod.yml，严禁写进本文件
  # 发布内容安全检测（msgSecCheck），生产必须 true
  security-check: true
  app-id: ${WX_APPID:wx48c61f9087e67672}
  secret: ${WX_SECRET:e38ffc597709086d11fdb8dc024cc813}
  # JWT 签名密钥，生产环境务必在 application-local.yml 里换成随机长串
  jwt-secret: nearby-pro-dev-jwt-secret-0123456789abcdef
  jwt-expire-days: 30
  # 订阅消息模板 id（聊天离线提醒）；与小程序 utils/config.js 的 SUBSCRIBE_TMPL_ID 保持一致
  subscribe-template-id: 0fA2jnuqS0NcYNtvPjFYugBtz3lg0J-PVAdZA07hpNU

im:
  # MobileIMSDK 网关开关（本地不需要聊天联调时可改 false）
  enabled: true
  # WebSocket 网关端口：小程序端连接（握手路径 /websocket）
  websocket-port: 3000
  # TCP 网关端口：官方 Java Demo 联调用
  tcp-port: 8901
