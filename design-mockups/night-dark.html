<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 390px; height: 844px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; position: relative; overflow: hidden; background: #12151B; }

  .map { position: absolute; inset: 0; }

  .filters { position: absolute; top: 16px; left: 0; right: 0; z-index: 10; padding: 0 16px; }
  .chips { display: flex; gap: 8px; }
  .chip { flex-shrink: 0; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; color: #A8B0BC; background: rgba(26,30,38,.82); border: .5px solid rgba(255,255,255,.09); backdrop-filter: blur(12px); }
  .chip.on { background: linear-gradient(135deg, #F5A623, #E8842A); color: #16130D; font-weight: 700; border-color: transparent; box-shadow: 0 4px 18px rgba(245,166,35,.35); }
  .chips-sub { margin-top: 10px; }
  .chip.sm { padding: 6px 14px; font-size: 11px; }

  .fab { position: absolute; right: 18px; bottom: 255px; width: 46px; height: 46px; border-radius: 14px; background: rgba(26,30,38,.88); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 8px 24px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(12px); }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(22,26,33,.96); backdrop-filter: blur(20px); border-radius: 26px 26px 0 0; border-top: 1px solid rgba(255,255,255,.08); padding: 10px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .handle { width: 36px; height: 4px; border-radius: 99px; background: #3A4150; margin: 4px auto 14px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .tool { flex: 1; height: 42px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); font-size: 13px; font-weight: 600; color: #D5DAE3; display: flex; align-items: center; justify-content: center; }
  .tool.primary { background: linear-gradient(135deg, #F5A623, #E8842A); color: #16130D; border: none; box-shadow: 0 8px 22px rgba(245,166,35,.38); }

  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 18px; }
  .kicker { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #F5A623; font-weight: 700; letter-spacing: .02em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #F5A623; box-shadow: 0 0 10px rgba(245,166,35,.8); }
  .title { margin-top: 6px; font-size: 21px; font-weight: 700; color: #F2F4F8; line-height: 1.3; }
  .sub { margin-top: 6px; font-size: 12px; color: #7E8794; }
  .cta { margin-top: 14px; height: 44px; border-radius: 999px; background: linear-gradient(135deg, #F5A623, #E8842A); color: #16130D; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(245,166,35,.35); }

  .callout { position: absolute; z-index: 15; background: linear-gradient(135deg, #F5A623, #E8842A); color: #16130D; padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; box-shadow: 0 8px 20px rgba(245,166,35,.45); }
  .callout::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: #EF9628; border-radius: 2px; }
</style>
</head>
