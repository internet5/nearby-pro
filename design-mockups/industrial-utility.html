<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1C1E22;
    --panel: #24272D;
    --line: #3A3E46;
    --amber: #E8A33D;
    --text: #E6E2D8;
    --muted: #8B8F98;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px;
    font-family: "Courier New", "Consolas", "Microsoft YaHei", monospace;
    position: relative; overflow: hidden; background: var(--bg); color: var(--text);
  }
  .map { position: absolute; inset: 0; }

  /* ---- 顶部状态条 ---- */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 10px; letter-spacing: .14em; color: var(--muted);
    border-bottom: 1px solid var(--line); background: rgba(28,29,34,.9);
  }
  .statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); display: inline-block; margin-right: 6px; }
  .statusbar .live { color: var(--amber); font-weight: 700; }

  /* ---- 筛选 ---- */
  .filters { position: absolute; top: 62px; left: 0; right: 0; z-index: 11; padding: 0 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    flex-shrink: 0; padding: 7px 12px; font-size: 12px; font-weight: 700;
    color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    font-family: inherit; letter-spacing: .06em;
  }
  .chip.on { color: #1C1D22; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 12px rgba(232,163,61,.35); }
  .chips-sub { margin-top: 8px; }
  .chip.sm { font-size: 10px; padding: 5px 10px; font-weight: 600; }

  /* ---- 定位按钮 ---- */
  .fab {
    position: absolute; right: 16px; bottom: 268px; width: 44px; height: 44px;
    background: var(--panel); border: 1.5px solid var(--amber);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    box-shadow: 0 0 14px rgba(232,163,61,.2);
  }

  /* ---- 底部面板 ---- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--panel); border-top: 2px solid var(--amber);
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .sheet-title { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--text); }
  .sheet-title::before { content: "▮ "; color: var(--amber); }
  .sheet-more { font-size: 10px; color: var(--amber); letter-spacing: .1em; }
  .toolbar { display: flex; gap: 8px; margin: 10px 0; }
  .tool {
    flex: 1; height: 40px; border: 1.5px solid var(--line); font-family: inherit;
    font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--text);
    display: flex; align-items: center; justify-content: center; background: transparent;
  }
  .tool.primary { background: var(--amber); color: #1C1D22; border-color: var(--amber); box-shadow: 0 0 14px rgba(232,163,61,.3); }

  .card { border: 1px solid var(--line); background: #141519; padding: 14px 16px; position: relative; }
  .card::before {
    content: "SKILL"; position: absolute; top: -1px; right: -1px;
    background: var(--amber); color: #1C1D22; font-size: 9px; letter-spacing: .16em; font-weight: 700; padding: 3px 8px;
  }
  .card-kicker { font-size: 10px; letter-spacing: .18em; color: var(--amber); font-weight: 700; }
  .card-title { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: .03em; line-height: 1.25; }
  .card-sub { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .card-go {
    margin-top: 14px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line); padding-top: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--amber);
  }
  .card-go .arr { font-size: 15px; }

  .callout {
    position: absolute; z-index: 15; background: var(--amber); color: #1C1D22;
    padding: 6px 11px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    box-shadow: 0 0 12px rgba(232,163,61,.4);
  }
  .callout::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 9px; height: 9px; background: var(--amber); }
</style>
</head>
