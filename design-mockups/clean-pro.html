<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 390px; height: 844px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; position: relative; overflow: hidden; background: #EEF1F5; }

  .map { position: absolute; inset: 0; }

  /* ---- 顶部搜索筛选 ---- */
  .top { position: absolute; top: 16px; left: 0; right: 0; z-index: 10; padding: 0 16px; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(23,42,64,.10); }
  .search-icon { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #94A3B8; position: relative; flex-shrink: 0; }
  .search-icon::after { content: ""; position: absolute; width: 7px; height: 2px; background: #94A3B8; border-radius: 2px; transform: rotate(45deg); bottom: -3px; right: -5px; }
  .search-text { font-size: 14px; color: #94A3B8; flex: 1; }
  .search-badge { font-size: 11px; color: #2563EB; font-weight: 600; background: #EFF4FF; padding: 4px 10px; border-radius: 99px; }
  .chips { display: flex; gap: 8px; margin-top: 10px; }
  .chip { flex-shrink: 0; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #475569; background: #fff; box-shadow: 0 2px 8px rgba(23,42,64,.06); border: .5px solid #E2E8F0; }
  .chip.on { background: #2563EB; color: #fff; font-weight: 600; border-color: transparent; box-shadow: 0 4px 12px rgba(37,99,235,.30); }

  .fab { position: absolute; right: 18px; bottom: 300px; width: 44px; height: 44px; border-radius: 12px; background: #fff; box-shadow: 0 6px 20px rgba(23,42,64,.15); display: flex; align-items: center; justify-content: center; z-index: 10; }

  /* ---- 底部列表 ---- */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 40px rgba(23,42,64,.12); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; }
  .sheet-title { font-size: 17px; font-weight: 700; color: #0F172A; }
  .sheet-more { font-size: 12px; color: #2563EB; font-weight: 600; }
  .rows { padding: 0 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #F1F5F9; }
  .avatar { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; font-weight: 600; flex-shrink: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 15px; font-weight: 600; color: #0F172A; }
  .row-meta { margin-top: 3px; font-size: 12px; color: #94A3B8; }
  .dist { font-size: 11px; font-weight: 600; color: #2563EB; background: #EFF4FF; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
  .arrow { font-size: 18px; color: #CBD5E1; font-weight: 300; flex-shrink: 0; }
  .cta { margin: 4px 20px 20px; height: 48px; border-radius: 14px; background: #2563EB; color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(37,99,235,.30); }

  .callout { position: absolute; z-index: 15; background: #fff; color: #0F172A; padding: 7px 11px; border-radius: 9px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 16px rgba(23,42,64,.18); border: 1px solid #E2E8F0; }
  .callout::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 9px; height: 9px; background: #fff; border-right: 1px solid #E2E8F0; border-bottom: 1px solid #E2E8F0; border-radius: 2px; }
</style>
</head>
<body>
