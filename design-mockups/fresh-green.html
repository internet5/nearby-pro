<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --paper: #F3F6EE;
    --paper-2: #E9EFE2;
    --green: #3E6B4F;
    --green-deep: #2F5240;
    --green-soft: #DDE8D6;
    --ink: #2F3A32;
    --muted: #7C8A7E;
    --road: #FAFCF7;
    --accent: #7FB069;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    position: relative; overflow: hidden; background: var(--paper); color: var(--ink);
  }
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background-image: radial-gradient(circle at 20% 30%, rgba(62,107,79,.05) 0 1px, transparent 1.5px);
    background-size: 24px 24px; mix-blend-mode: multiply;
  }
  .map { position: absolute; inset: 0; }

  /* ---- 顶部 ---- */
  .masthead {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    padding: 18px 18px 0; display: flex; align-items: center; justify-content: space-between;
  }
  .loc {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.8); border: 1px solid var(--green-soft);
    padding: 9px 14px; border-radius: 999px; box-shadow: 0 4px 14px rgba(62,110,79,.08);
    backdrop-filter: blur(6px);
  }
  .loc .pin { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; background: var(--green); transform: rotate(-45deg); flex-shrink: 0; }
  .loc .pin::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; margin: 4.5px 0 0 4.5px; }
  .loc-text { font-size: 13px; font-weight: 600; }
  .loc-count { font-size: 11px; color: var(--green); font-weight: 700; background: var(--green-soft); padding: 3px 9px; border-radius: 99px; }
  .brand-tag {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    display: flex; align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 6px 16px rgba(62,110,79,.3); line-height: 1.3;
  }

  /* ---- 筛选 ---- */
  .filters { position: absolute; top: 84px; left: 0; right: 0; z-index: 11; padding: 0 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    flex-shrink: 0; padding: 8px 15px; font-size: 13px; font-weight: 600;
    color: var(--muted); background: rgba(255,255,255,.85); border: 1px solid var(--green-soft);
    border-radius: 999px; backdrop-filter: blur(4px);
  }
  .chip.on { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 6px 16px rgba(62,110,79,.28); }
  .chips-sub { margin-top: 9px; }
  .chip.sm { padding: 6px 13px; font-size: 11px; font-weight: 500; }

  /* ---- 定位按钮 ---- */
  .fab {
    position: absolute; right: 18px; bottom: 268px; width: 46px; height: 46px;
    border-radius: 50%; background: #fff; border: 1px solid var(--green-soft);
    box-shadow: 0 6px 18px rgba(62,110,79,.14);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }

  /* ---- 底部面板 ---- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--paper); border-radius: 26px 26px 0 0;
    padding: 8px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 30px rgba(62,110,79,.12);
  }
  .handle { width: 38px; height: 4px; border-radius: 99px; background: var(--green-soft); margin: 2px auto 12px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  .tool {
    flex: 1; height: 42px; border-radius: 999px; border: 1.5px solid var(--green-soft);
    font-size: 13px; font-weight: 600; color: var(--green); background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
  }
  .tool.primary {
    background: linear-gradient(135deg, var(--green), var(--green-deep)); color: #fff;
    border: none; box-shadow: 0 8px 18px rgba(62,110,79,.3);
  }

  .card {
    background: #fff; border-radius: 18px; padding: 16px 18px;
    box-shadow: 0 6px 20px rgba(62,110,79,.08); border: 1px solid var(--green-soft);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--green), var(--accent));
  }
  .card-kicker { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--green); font-weight: 700; letter-spacing: .04em; }
  .card-kicker .leaf { width: 10px; height: 10px; border-radius: 50% 50% 50% 0; background: var(--green); transform: rotate(-45deg); }
  .card-title { margin-top: 8px; font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .card-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .card-go {
    margin-top: 14px; height: 40px; border-radius: 999px;
    background: var(--green-soft); color: var(--green-deep);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  .callout {
    position: absolute; z-index: 15; background: #fff; color: var(--ink);
    padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(62,110,79,.16); border: 1px solid var(--green-soft);
  }
  .callout::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 9px; height: 9px; background: #fff; border-right: 1px solid var(--green-soft); border-bottom: 1px solid var(--green-soft); border-radius: 2px; }
</style>
</head>
