<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink: #141414;
    --paper: #F7F5F0;
    --red: #D23B2E;
    --grey: #8A857B;
    --line: #D8D2C6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; font-family: "Songti SC", "SimSun", "STSong", serif;
    position: relative; overflow: hidden; background: var(--paper); color: var(--ink);
  }
  .map { position: absolute; inset: 0; opacity: .5; }

  /* ---- 顶部刊头 ---- */
  .masthead {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    padding: 14px 18px 0; border-bottom: 2px solid var(--ink);
    background: linear-gradient(var(--paper) 82%, transparent);
  }
  .mast-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: .18em; color: var(--grey); }
  .mast-top .vol { font-weight: 700; color: var(--ink); }
  .wordmark {
    font-size: 40px; font-weight: 700; letter-spacing: .1em; line-height: 1.1;
    display: flex; align-items: baseline; gap: 8px;
  }
  .wordmark .accent { color: var(--line); font-size: 30px; }
  .dateline { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .14em; color: var(--grey); padding: 6px 0 8px; }

  /* ---- 分类：编辑标签 ---- */
  .filters { position: absolute; top: 118px; left: 0; right: 0; z-index: 11; padding: 0 18px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    flex-shrink: 0; padding: 6px 12px; font-size: 12px; font-weight: 600;
    color: var(--ink); border: 1px solid var(--ink); border-radius: 2px;
    background: transparent; letter-spacing: .05em;
  }
  .chip.on { background: var(--ink); color: var(--paper); }
  .chips-sub { margin-top: 8px; }
  .chip.sm { font-size: 10px; padding: 4px 10px; border-color: var(--line); color: var(--grey); font-weight: 500; }
  .chip.sm.on { border-color: var(--red); color: var(--red); background: transparent; }

  /* ---- 定位按钮 ---- */
  .fab {
    position: absolute; right: 18px; bottom: 268px; width: 44px; height: 44px;
    border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }

  /* ---- 底部面板 ---- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--paper); border-top: 2px solid var(--ink);
    padding: 10px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
  .sheet-title { font-size: 15px; font-weight: 700; letter-spacing: .08em; }
  .sheet-more { font-size: 10px; color: var(--red); letter-spacing: .1em; }
  .toolbar { display: flex; gap: 8px; margin: 10px 0; }
  .tool {
    flex: 1; height: 40px; border: 1.5px solid var(--ink); border-radius: 2px;
    font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--ink);
    display: flex; align-items: center; justify-content: center; background: transparent;
  }
  .tool.primary { background: var(--red); color: #fff; border-color: var(--red); }

  .card { border: 1.5px solid var(--ink); padding: 14px 16px; position: relative; background: #fff; }
  .card-flag {
    position: absolute; top: -1px; right: -1px; background: var(--red); color: #fff;
    font-size: 9px; letter-spacing: .14em; padding: 4px 10px; font-weight: 700;
  }
  .card-kicker { font-size: 10px; letter-spacing: .18em; color: var(--red); font-weight: 700; }
  .card-title { margin-top: 8px; font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: .02em; }
  .card-sub { margin-top: 6px; font-size: 12px; color: var(--grey); }
  .card-go {
    margin-top: 14px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line); padding-top: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
  }
  .card-go .arr { font-size: 16px; }

  .callout {
    position: absolute; z-index: 15; background: var(--ink); color: var(--paper);
    padding: 6px 11px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
    border-radius: 2px;
  }
  .callout::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 9px; height: 9px; background: var(--ink); }
</style>
</head>
