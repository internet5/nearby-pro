<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --paper: #F4EDDD;
    --paper-2: #ECE2CC;
    --ink: #2E2A24;
    --ink-soft: #6B6255;
    --seal: #C03A2B;
    --seal-deep: #A32E22;
    --green: #3E5C4B;
    --road: #FBF6EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", serif;
    position: relative; overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }
  /* 纸张纹理 */
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(46,42,36,.035) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(46,42,36,.03) 0 1px, transparent 1.5px);
    background-size: 26px 26px, 34px 34px;
    mix-blend-mode: multiply;
  }

  .map { position: absolute; inset: 0; }

  /* ---- 顶部：标题 + 印章 ---- */
  .masthead {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    padding: 18px 18px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .wordmark { line-height: 1; }
  .wordmark .cn {
    font-size: 30px; font-weight: 700; letter-spacing: .06em; color: var(--ink);
    text-shadow: 1px 1px 0 rgba(255,255,255,.4);
  }
  .wordmark .sub {
    margin-top: 6px; font-size: 11px; letter-spacing: .42em; color: var(--ink-soft);
  }
  .stamp {
    width: 52px; height: 52px; border: 2.5px solid var(--seal); border-radius: 4px;
    color: var(--seal); font-size: 12px; font-weight: 700; letter-spacing: .12em;
    display: flex; align-items: center; justify-content: center; text-align: center;
    transform: rotate(4deg); line-height: 1.35;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--seal);
    background: rgba(194,58,46,.04);
  }

  /* ---- 分类：印章标签 ---- */
  .filters { position: absolute; top: 96px; left: 0; right: 0; z-index: 11; padding: 0 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    flex-shrink: 0; padding: 7px 13px; font-size: 13px; font-weight: 700;
    color: var(--ink-soft); background: rgba(255,252,244,.72);
    border: 1.5px dashed #C9BC9E; border-radius: 3px; letter-spacing: .04em;
    backdrop-filter: blur(4px);
  }
  .chip.on {
    color: #FBF6EA; background: var(--seal); border: 1.5px solid var(--seal);
    box-shadow: 2px 2px 0 rgba(46,42,36,.18);
  }
  .chips-sub { margin-top: 8px; }
  .chip.sm { padding: 5px 11px; font-size: 11px; font-weight: 600; }

  /* ---- 定位按钮 ---- */
  .fab {
    position: absolute; right: 18px; bottom: 268px; width: 46px; height: 46px;
    border-radius: 50%; background: var(--paper-2); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(46,42,36,.25);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }

  /* ---- 底部面板 ---- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--paper); border-top: 2px solid var(--ink);
    border-radius: 14px 14px 0 0;
    padding: 8px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 24px rgba(46,42,36,.16);
  }
  .handle { width: 40px; height: 4px; border-radius: 99px; background: #C9BE9F; margin: 2px auto 12px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  .tool {
    flex: 1; height: 42px; border-radius: 6px; border: 2px solid var(--ink);
    font-size: 13px; font-weight: 700; color: var(--ink); background: transparent;
    display: flex; align-items: center; justify-content: center; letter-spacing: .1em;
  }
  .tool.primary {
    background: var(--seal); color: #FBF3E6; border-color: var(--seal);
    box-shadow: 3px 3px 0 rgba(163,46,31,.35);
  }

  .card {
    background: #FBF6EA; border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 14px 16px; position: relative;
    box-shadow: 3px 3px 0 rgba(46,42,36,.14);
  }
  .card::before {
    content: "匠"; position: absolute; top: -9px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--seal); color: #FBF3E6; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--paper); box-shadow: 0 0 0 1.5px var(--seal);
    transform: rotate(8deg);
  }
  .card-kicker {
    display: flex; align-items: center; gap: 7px; font-size: 11px;
    color: var(--seal); font-weight: 700; letter-spacing: .08em;
  }
  .card-kicker::before { content: "●"; font-size: 8px; }
  .card-title { margin-top: 7px; font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.25; letter-spacing: .02em; }
  .card-sub { margin-top: 5px; font-size: 12px; color: var(--ink-soft); }
  .card-go {
    margin-top: 12px; height: 38px; border-radius: 5px;
    background: var(--ink); color: var(--paper);
    font-size: 13px; font-weight: 700; letter-spacing: .08em;
    display: flex; align-items: center; justify-content: center;
  }

  /* 选中气泡 */
  .callout {
    position: absolute; z-index: 15; background: var(--paper-2);
    color: var(--ink); padding: 7px 12px; border-radius: 4px;
    font-size: 12px; font-weight: 700; letter-spacing: .04em;
    border: 1.5px dashed var(--ink); box-shadow: 2px 2px 0 rgba(46,42,36,.18);
  }
  .callout::after {
    content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 9px; height: 9px; background: var(--paper-2); border-right: 1.5px dashed var(--ink); border-bottom: 1.5px dashed var(--ink);
  }
</style>
</head>
<body>
