# 应用：nearby-pro-server jar 包（挂载运行，不打包进镜像）
# jar 位置：本目录（app-deploy）下，与 docker-compose.yml 一起随目录上传服务器
# 前置步骤：
#   1) 先启动 ../middleware-deploy
#   2) 项目根执行 mvn clean package -DskipTests
#      并把 nearby-pro-server/target/nearby-pro-server-*.jar 拷进本目录
# 启动：cd docker/app-deploy && docker compose up -d
# 更新：替换本目录 jar 后执行 docker compose restart nearby-app
name: nearby-app

services:
  nearby-app:
    image: eclipse-temurin:17-jre
    container_name: nearby-app
    restart: unless-stopped
    working_dir: /app
    # shell 方式启动，让 *.jar 通配符生效，jar 文件名带版本号也不用改这里
    entrypoint: ["sh", "-c", "java -jar /app/*.jar"]
    environment:
      TZ: Asia/Shanghai
      # 激活生产 profile（application-prod.yml：真实微信登录 + msgSecCheck，密钥在 jar 内该文件）
      SPRING_PROFILES_ACTIVE: prod
      # 中间件与本项目不在同一 compose 网络，经宿主机端口访问（172.17.0.1 = docker0 网桥宿主机地址）
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.17.0.1:5432/nearby_pro?stringtype=unspecified
      REDIS_HOST: 172.17.0.1
      # JWT 签名密钥：务必保持随机长串，与 application.yml 的 dev 默认值不同
      WX_JWT_SECRET: nearby-pro-dev-jwt-secret-0123456789abcdef
      # 聊天离线提醒的订阅消息模板 id（与小程序 config.js 的 SUBSCRIBE_TMPL_ID 一致）
      WX_SUBSCRIBE_TEMPLATE_ID: "0fA2jnuqS0NcYNtvPjFYugBtz3lg0J-PVAdZA07hpNU"
      # IM 网关（MobileIMSDK）：WebSocket 3000 小程序连、TCP 8901 Java Demo 联调
      IM_ENABLED: "true"                           # 不需要私聊时改 "false"（不启动 Netty 网关）
    ports:
      - "8080:8080"
      - "3000:3000"   # IM WebSocket：nginx 经 172.17.0.1 转发 wss；云安全组可只对内开放
      - "8901:8901"   # IM TCP：仅联调用，上线后可关闭映射
    volumes:
      - .:/app:ro    # 挂载本目录（compose 文件所在处）为容器 /app，jar 放本目录即可
