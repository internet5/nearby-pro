# 附近职人后端反向代理
# https: red-packet.com.cn -> 宿主机 8080（nearby-app 容器映射在宿主机上）
# 配置与证书均为整目录挂载：conf -> /etc/nginx/conf.d/，ssl -> /etc/nginx/ssl/（deploy.sh 同步）
# 改动本文件后：重跑 deploy.sh（或手动拷到 /data/nginx/conf/ 后 restart nginx）
# 证书路径：宿主机 /data/nginx/ssl 挂到容器 /etc/nginx/ssl/，下方 ssl_certificate 与之对应
# 172.17.0.1 是 docker0 网桥的宿主机地址：容器经它访问宿主机端口

server {
    listen 443 ssl;
    server_name red-packet.com.cn www.red-packet.com.cn;

    ssl_certificate     /etc/nginx/ssl/red-packet.com.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/red-packet.com.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 预留图片上传体积上限
    client_max_body_size 10m;

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name red-packet.com.cn www.red-packet.com.cn;
    return 301 https://$host$request_uri;
}
